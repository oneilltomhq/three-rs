# The browser shell for the graded examples (issue #128).
#
# A workspace member rather than part of `three-rs`: it is a driver of the
# examples, the third after `tests/e2e/main.rs` and `src/bin/viewer.rs`, and
# nothing the library publishes should depend on wasm-bindgen. `publish =
# false` for the same reason, and the root manifest's `exclude` keeps it out of
# the packaged crate.
[package]
name = "three-rs-web"
version = "0.1.0"
description = "The three-rs graded examples, running in a browser on WebGPU."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "three_rs_web"
path = "src/main.rs"

[dependencies]
three-rs = { path = ".." }
# `SurfaceTarget::Canvas` needs wgpu here too, and the version is pinned to the
# library's so that both halves of the page are the one wgpu.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
serde_json = "1"

# Everything below is the browser, and only builds there. Natively `main.rs` is
# a `main` that does nothing (see its header), so `cargo build --workspace`
# still works on a desktop.
#
# The list is deliberately short. No winit: the surface comes straight from a
# canvas element. No framework and no bundler: the page is hand-written HTML
# and the only build step is wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu"] }
# The JS boundary: `#[wasm_bindgen(start)]`, `spawn_local` to drive the
# adapter/device/fetch awaits off the page's single thread, and `Closure` for
# the `requestAnimationFrame` loop and every DOM listener.
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
# `console_error_panic_hook` turns a Rust panic into a readable console trace
# instead of "unreachable executed"; without it a loader failure is unreadable.
console_error_panic_hook = "0.1.7"

# One feature per DOM call the shell makes, so the generated bindings stay
# small: the canvas, the query string that names the example, `fetch` for the
# assets, the two elements the no-WebGPU message replaces the canvas with, and
# the pointer/wheel/key events the animation loop hands to the controls.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.105"
features = [
    # `console.error` / `console.warn`: wgpu's uncaptured-error callback and a
    # frame that could not be presented, neither of which belongs on the one
    # status line.
    "console",
    # The input the animation loop feeds to the example's `OrbitControls`, plus
    # the non-passive `wheel` registration that lets it be cancelled.
    "AddEventListenerOptions",
    "DomTokenList",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    # `element.style`, for swapping the canvas out for the still.
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Navigator",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
]
