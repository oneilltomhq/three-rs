[package]
name = "d3-hierarchy"
version = "0.1.0"
description = "Port of d3-hierarchy 3.1.2 to Rust (f64, same operation order as the JS): cluster, tree, partition, pack, treemap, stratify."
documentation = "https://docs.rs/d3-hierarchy"
readme = "README.md"
keywords = ["d3", "hierarchy", "treemap", "layout", "tree"]
categories = ["algorithms", "data-structures", "visualization"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
exclude = ["target/**"]

[dependencies]
serde_json = "1"
