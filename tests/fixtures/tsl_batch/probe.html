<!DOCTYPE html>
<html lang="en">
	<head>
		<title>tsl batch probe</title>
		<meta charset="utf-8">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as T from 'three/tsl';
			const { Fn, uv, vec2, vec3, vec4, float, int, uint, bool, color, mat2, mat3, mat4, uvec2, uvec3, uvec4, ivec3, ivec4, bvec2, bvec3, bvec4,
				PI, PI2, HALF_PI, EPSILON, INFINITY, TWO_PI,
				atan, acos, asin, tan, round, trunc, degrees, radians, sinh, cosh, tanh, asinh, acosh, atanh,
				hash, rand, triNoise3D, determinant, inverse, transpose,
				pow2, pow3, pow4, difference, cbrt, faceForward, pcurve, gain, parabola, sinc, lengthSq,
				xor, bitNot, increment, decrement, incrementBefore, decrementBefore, countOneBits, countTrailingZeros, countLeadingZeros,
				floatBitsToInt, floatBitsToUint, intBitsToFloat, uintBitsToFloat,
				oscTriangle, oscSquare, oscSawtooth, oscSine, rotateUV, spherizeUV, remap, remapClamp, deltaTime, frameId, time,
				modelWorldMatrix, uniform, mod, smoothstep, step, positionLocal,
				packSnorm2x16, packUnorm2x16, packHalf2x16, packSnorm4x8, packUnorm4x8, unpackSnorm2x16, unpackUnorm2x16, unpackHalf2x16, unpackSnorm4x8, unpackUnorm4x8,
				pack4xI8, pack4xU8, pack4xI8Clamp, pack4xU8Clamp, unpack4xI8, unpack4xU8, dot4U8Packed, dot4I8Packed, all, any,
				transformNormalByViewMatrix, transformNormalByInverseViewMatrix, faceforward, inversesqrt, cameraViewMatrix,
				equirectDirection, matcapUV, maxMipLevel, spritesheetUV, triplanarTextures, textureBicubic, texture3DLoad, texture3DLevel,
				texture, positionWorld, normalWorld,
				bitangentGeometry, bitangentLocal, bitangentWorld, tangentWorld, parallaxDirection, parallaxUV, cameraNormalMatrix, cameraNear, cameraFar,
				modelDirection, modelPosition, modelScale, modelViewPosition, modelRadius, objectDirection, objectPosition, objectScale, objectViewPosition, objectRadius,
				mediumpModelViewMatrix, highpModelViewMatrix, highpModelNormalViewMatrix, transformNormal, transformNormalToView, modelNormalMatrix, normalLocal,
				reflectView, refractView, refractVector, clipSpace } = T;

			const map = new THREE.DataTexture( new Uint8Array( 4 * 16 * 16 ), 16, 16 );
			map.minFilter = THREE.LinearMipmapLinearFilter;
			map.magFilter = THREE.LinearFilter;
			map.generateMipmaps = true;
			map.needsUpdate = true;
			const volume = new THREE.Data3DTexture( new Uint8Array( 8 * 8 * 8 ), 8, 8, 8 );
			volume.format = THREE.RedFormat;
			volume.minFilter = THREE.LinearFilter;
			volume.magFilter = THREE.LinearFilter;
			volume.needsUpdate = true;

			const tangentPlane = new THREE.PlaneGeometry( 0.5, 0.5 );
			tangentPlane.computeTangents();
			const target = new THREE.Object3D();
			target.position.set( 1, 2, 3 );

			const probes = [];
			const probe = ( name, build, geometry = null ) => probes.push( [ name, build, geometry ] );

			const x = () => uv().x;
			const y = () => uv().y;

			probe( 'constructors_color', () => vec4( color( 0xff8000 ).add( color( 0.25, 0.5, 0.75 ) ), 1 ) );
			probe( 'constructors_int_vectors', () => vec4( vec3( uvec3( 1, 2, 3 ) ).add( vec3( ivec3( - 1, 2, - 3 ) ) ).add( vec3( uvec3( x().mul( 10 ) ) ) ), float( ivec4( 1, 2, 3, 4 ).w ) ) );
			probe( 'constructors_uvec_join', () => vec4( vec2( uvec2( x().mul( 4 ), y().mul( 4 ) ) ), float( uvec4( 1, 2, 3, 4 ).z ), 1 ) );
			probe( 'constructors_bool_vectors', () => vec4( vec2( bvec2( x.call().greaterThan( 0.5 ), true ) ), vec2( bvec3( true, false, y().lessThan( 0.5 ) ).xy ) ).add( float( bool( x().greaterThan( y() ) ) ) ).add( vec4( bvec4( true, false, true, false ) ) ) );
			probe( 'constructors_matrices', () => vec4( mat3( modelWorldMatrix ).mul( vec3( uv(), 1 ) ), 1 ).add( vec4( mat2( 1, 2, 3, 4 ).mul( uv() ), 0, 0 ) ) );
			probe( 'constants', () => vec4( x().mul( PI ), x().mul( PI2 ), x().mul( HALF_PI ), x().add( EPSILON ).min( INFINITY ) ) );
			probe( 'trig', () => vec4( atan( x() ).add( acos( x() ) ).add( asin( x() ) ).add( tan( x() ) ), sinh( x() ).add( cosh( x() ) ).add( tanh( x() ) ), asinh( x() ).add( acosh( x().add( 1 ) ) ).add( atanh( x().mul( 0.5 ) ) ), round( x() ).add( trunc( y() ) ).add( degrees( x() ) ).add( radians( y() ) ) ) );
			probe( 'trig_methods', () => vec4( uv().atan(), uv().tan(), 1 ) );
			probe( 'matrices', () => {
				const m2 = mat2( x(), y(), 0.5, 1 );
				const m3 = mat3( modelWorldMatrix );
				return vec4( inverse( m2 ).mul( uv() ), determinant( m3 ), 1 ).add( vec4( transpose( m3 ).mul( vec3( uv(), 1 ) ), 1 ) ).add( inverse( modelWorldMatrix ).mul( vec4( uv(), 0, 1 ) ) ).add( vec4( inverse( m3 ).mul( vec3( uv(), 1 ) ), 1 ) );
			} );
			probe( 'powers', () => vec4( pow2( x() ), pow3( y() ), pow4( x() ), difference( x(), y() ).add( cbrt( x() ) ).add( lengthSq( uv() ) ) ) );
			probe( 'face_forward', () => vec4( faceForward( vec3( uv(), 1 ), vec3( 0, 0, 1 ), vec3( y(), x(), 0.5 ) ), 1 ) );
			probe( 'shaping', () => vec4( pcurve( x(), 2, 3 ), gain( x(), 2 ), parabola( y(), 2 ), sinc( x(), float( 3 ) ) ) );
			probe( 'bits', () => {
				const i = int( x().mul( 100 ) );
				const u = uint( y().mul( 100 ) );
				return vec4( float( xor( x().greaterThan( 0.5 ), y().greaterThan( 0.5 ) ) ), float( bitNot( i ) ), float( countOneBits( u ).add( countTrailingZeros( u ) ).add( countLeadingZeros( u ) ) ), 1 );
			} );
			probe( 'bitcast', () => vec4( float( floatBitsToInt( x() ) ), float( floatBitsToUint( y() ) ), intBitsToFloat( int( x().mul( 10 ) ) ), uintBitsToFloat( uint( y().mul( 10 ) ) ) ) );
			probe( 'increment', Fn( () => {
				const i = int( x().mul( 10 ) ).toVar();
				const a = increment( i );
				const b = decrement( i );
				const c = incrementBefore( i );
				const d = decrementBefore( i );
				return vec4( float( a ), float( b ), float( c ), float( d ) );
			} ) );
			probe( 'hash_rand', () => vec4( hash( x().mul( 100 ) ), rand( uv() ), 0, 1 ) );
			probe( 'tri_noise_3d', () => vec4( vec3( triNoise3D( vec3( uv(), 0.5 ), 1, time ) ), 1 ) );
			probe( 'oscillators', () => vec4( oscTriangle(), oscSquare(), oscSawtooth( x() ), oscSine() ) );
			probe( 'uv_utils', () => vec4( rotateUV( uv(), time ), spherizeUV( uv(), 10 ) ) );
			probe( 'remap', () => vec4( x().remap( 0.2, 0.8 ), x().remapClamp( 0.2, 0.8, 1, 2 ), remap( y(), 0, 1, 2, 3 ), remapClamp( y(), 0.1, 0.9 ) ) );
			probe( 'timer', () => vec4( deltaTime, float( frameId ), time, 1 ) );
			probe( 'mod', () => vec4( uv().mod( 0.5 ), x().mod( 0.25 ), float( int( x().mul( 10 ) ).mod( 3 ) ) ).add( vec4( vec3( uv(), 1 ).mod( vec3( 0.5 ) ), 1 ) ).add( vec4( uv(), 0, 1 ).mod( 1 ) ) );
			probe( 'element_forms', () => vec4( x().smoothstep( 0.2, 0.8 ), y().step( 0.5 ), smoothstep( 0, 1, uv() ) ) );
			probe( 'pack_float', () => vec4( float( packSnorm2x16( uv() ) ), float( packUnorm2x16( uv() ) ), float( packHalf2x16( uv() ) ), float( packSnorm4x8( vec4( uv(), 0, 1 ) ) ).add( float( packUnorm4x8( vec4( uv(), 0, 1 ) ) ) ) ) );
			probe( 'unpack_float', () => vec4( unpackSnorm2x16( uint( x().mul( 1000 ) ) ), unpackUnorm2x16( uint( y().mul( 1000 ) ) ) ).add( vec4( unpackHalf2x16( uint( x().mul( 100 ) ) ), 0, 1 ) ).add( unpackSnorm4x8( uint( y().mul( 100 ) ) ) ).add( unpackUnorm4x8( uint( x().mul( 10 ) ) ) ) );
			probe( 'pack_4x8', () => vec4( float( pack4xI8( ivec4( int( x().mul( 10 ) ), - 2, 3, - 4 ) ) ), float( pack4xU8( uvec4( uint( y().mul( 10 ) ), 2, 3, 4 ) ) ), float( pack4xI8Clamp( ivec4( int( x().mul( 300 ) ), - 200, 3, 4 ) ) ), float( pack4xU8Clamp( uvec4( uint( y().mul( 300 ) ), 2, 3, 4 ) ) ) ) );
			probe( 'unpack_4x8', () => vec4( unpack4xI8( uint( x().mul( 1000 ) ) ) ).add( vec4( unpack4xU8( uint( y().mul( 1000 ) ) ) ) ).add( vec4( float( dot4U8Packed( uint( x().mul( 100 ) ), uint( y().mul( 100 ) ) ) ), float( dot4I8Packed( uint( x().mul( 50 ) ), uint( y().mul( 50 ) ) ) ), 0, 1 ) ) );
			probe( 'all_any', () => vec4( float( all( bvec2( x().greaterThan( 0.5 ), y().greaterThan( 0.5 ) ) ) ), float( any( bvec3( x().lessThan( 0.25 ), y().lessThan( 0.25 ), false ) ) ), float( uv().greaterThan( vec2( 0.5 ) ).all() ), float( uv().lessThan( vec2( 0.5 ) ).any() ) ) );
			probe( 'transform_normal', () => vec4( transformNormalByViewMatrix( vec3( uv(), 1 ), cameraViewMatrix ), 1 ).add( vec4( transformNormalByInverseViewMatrix( vec3( y(), x(), 1 ), cameraViewMatrix ), 0 ) ) );
			probe( 'deprecated_aliases', () => vec4( faceforward( vec3( uv(), 1 ), vec3( 0, 0, 1 ), vec3( y(), x(), 0.5 ) ), inversesqrt( x().add( 1 ) ) ) );
			probe( 'equirect_direction', () => vec4( equirectDirection( uv() ), 1 ).add( vec4( equirectDirection(), 0 ) ) );
			probe( 'matcap_uv', () => vec4( matcapUV, 0, 1 ) );
			probe( 'max_mip_level', () => vec4( maxMipLevel( texture( map ) ), 0, 0, 1 ) );
			probe( 'spritesheet_uv', () => vec4( spritesheetUV( vec2( 6, 4 ), uv(), time ), spritesheetUV( vec2( 3, 3 ) ) ) );
			probe( 'triplanar_textures', () => triplanarTextures( texture( map ), null, null, float( 2 ), positionWorld, normalWorld ) );
			probe( 'texture_bicubic', () => textureBicubic( texture( map, uv() ), float( 0.5 ) ) );
			probe( 'texture_3d', () => vec4( texture3DLoad( volume, ivec3( int( x().mul( 8 ) ), int( y().mul( 8 ) ), 2 ) ).x, texture3DLevel( volume, vec3( uv(), 0.5 ), float( 1 ) ).x, 0, 1 ) );

			probe( 'bitangent_geometry', () => vec4( bitangentGeometry, 1 ), tangentPlane );
			probe( 'bitangent_local', () => vec4( bitangentLocal, 1 ), tangentPlane );
			probe( 'bitangent_world', () => vec4( bitangentWorld.add( tangentWorld ), 1 ), tangentPlane );
			probe( 'tangent_world_frame', () => vec4( tangentWorld, 1 ) );
			probe( 'parallax', () => vec4( parallaxUV( uv(), float( 0.1 ) ).xy, parallaxDirection.z, 1 ) );
			probe( 'camera_near_far', () => vec4( cameraNear, cameraFar, cameraNormalMatrix.mul( vec3( uv(), 1 ) ).xy ) );
			probe( 'model_scopes', () => vec4( modelDirection.add( modelPosition ).add( modelScale ).add( modelViewPosition ), modelRadius ) );
			probe( 'object_scopes', () => vec4( objectDirection( target ).add( objectPosition( target ) ).add( objectScale( target ) ).add( objectViewPosition( target ) ), objectRadius( target ).add( 1 ) ) );
			probe( 'model_view_precision', () => vec4( mediumpModelViewMatrix.mul( vec4( positionLocal, 1 ) ).xyz.add( highpModelViewMatrix.mul( vec4( positionLocal, 1 ) ).xyz ).add( highpModelNormalViewMatrix.mul( normalLocal ) ), 1 ) );
			probe( 'transform_normal_matrix', () => vec4( transformNormal( vec3( uv(), 1 ) ).add( transformNormal( vec3( y(), x(), 1 ), cameraViewMatrix ) ).add( vec3( x(), 1, y() ).transformNormal( modelNormalMatrix ) ), 1 ) );
			probe( 'transform_normal_to_view', () => vec4( transformNormalToView( vec3( uv(), 1 ) ), 1 ) );
			probe( 'reflect_refract', () => vec4( reflectView.add( refractView ).add( refractVector ), 1 ) );
			probe( 'clip_space', () => clipSpace.div( clipSpace.w ) );

			init();

			async function init() {

				const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 0, 10 );

				const scene = new THREE.Scene();

				const geometry = new THREE.PlaneGeometry( 0.5, 0.5 );

				probes.forEach( ( [ name, build, probeGeometry ], index ) => {

					const material = new THREE.MeshBasicNodeMaterial();
					material.name = name;
					material.fragmentNode = build();
					const mesh = new THREE.Mesh( probeGeometry || geometry, material );
					mesh.position.x = ( index % 6 ) - 2.5;
					mesh.position.y = Math.floor( index / 6 ) - 2;
					mesh.renderOrder = index;
					mesh.frustumCulled = false;
					scene.add( mesh );

				} );

				const renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );
				await renderer.init();
				renderer.setAnimationLoop( () => renderer.render( scene, camera ) );

			}

		</script>
	</body>
</html>
