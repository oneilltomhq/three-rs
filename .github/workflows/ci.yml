# fmt, clippy, build and the non-GPU tests on every push to main and every
# PR. The e2e grader (tests/e2e) and anything that creates a `Renderer` need
# a Vulkan device and stay a manual pre-merge gate (see CONTRIBUTING.md);
# there is no self-hosted GPU runner yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The default `src/testing.rs::vendor_dir` location, so tests that read it
  # need no env var of their own.
  THREE_JS_DIR: ${{ github.workspace }}/vendor/three.js
  # The three.js commit the port is graded against: past r186, for the cube
  # PMREM of 2f80402 (#146). It becomes the r187 tag once upstream tags it.
  THREE_JS_REV: 5f610f516730eb11e0166d9fc21dfc34538dcdeb

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  # The library and the browser shell for wasm32 (issue #128). No GPU and no
  # browser here: this is the compile gate that keeps the wasm32 path from
  # rotting — a `std::fs` call sneaking back into a loader, or a native-only
  # dependency going unconditional — while the pixels are still graded by the
  # manual native ladder and by the `web-gate` job below.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p three-rs
      - run: cargo clippy --target wasm32-unknown-unknown -p three-rs -- -D warnings
      - run: cargo build --release --target wasm32-unknown-unknown -p three-rs-web
      - run: cargo clippy --target wasm32-unknown-unknown -p three-rs-web -- -D warnings

  # The graded examples, built for wasm32 and rendered in headless Chrome on
  # software WebGPU (Dawn on SwiftShader, which Chrome ships), then graded by
  # three.js' own `test/e2e/image.js` against `examples/screenshots/` exactly
  # as the native ladder grades them (issue #128). The one pixel gate CI can
  # run without a GPU. `tools/web_gate.skip` lists, with a reason each, the
  # examples that do not pass on the software adapter; they are still run and
  # reported in the job summary.
  web-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The CLI must be the exact version Cargo.lock pins for the crate;
      # web/build.sh refuses anything else.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;q}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: wasm-bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}
      - if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }} --locked

      - run: web/build.sh

      # Three's screenshots, image.js, puppeteer-core, pngjs and the Chrome
      # three.js' own `npm ci` downloads for its e2e suite.
      - name: Checkout three.js at THREE_JS_REV
        run: |
          git init -q "$THREE_JS_DIR"
          git -C "$THREE_JS_DIR" fetch -q --depth 1 https://github.com/mrdoob/three.js "$THREE_JS_REV"
          git -C "$THREE_JS_DIR" checkout -q FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/three.js/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('vendor/three.js/package-lock.json') }}
      - name: npm ci (three.js)
        working-directory: vendor/three.js
        run: npm ci --no-audit --no-fund

      - run: node tools/web_gate.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-gate
          path: |
            target/web-gate/
            !target/web-gate/.profile/
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tests/gltf_loader.rs reads Three's sample glTF models here, and
      # tests/addons_orbit_controls.rs runs Three's own OrbitControls.js out of
      # it under node to compare against; everything else here is
      # self-contained.
      - name: Checkout three.js at THREE_JS_REV (for gltf_loader)
        run: |
          git init -q "$THREE_JS_DIR"
          git -C "$THREE_JS_DIR" fetch -q --depth 1 https://github.com/mrdoob/three.js "$THREE_JS_REV"
          git -C "$THREE_JS_DIR" checkout -q FETCH_HEAD

      - name: Unit tests (no GPU)
        run: |
          cargo test -p three-rs --lib
          cargo test -p sdf-text --lib
          cargo test -p three-rs-controls --lib

      # The gallery generator's and the web manifest generator's own tests
      # (`test = true` on their `[[example]]`), neither of which needs a GPU:
      # the README table parse, the marker replacement, and that every graded
      # example has a committed web manifest.
      - name: Generator tests (no GPU)
        run: |
          cargo test -p three-rs --example gallery
          cargo test -p three-rs --example web_manifests

      # Every other `tests/*.rs` file that does not create a `Renderer`.
      # Excluded on purpose:
      #   - renderer_blending, renderer_instanced, renderer_lines: build a
      #     `Renderer`, which needs a Vulkan adapter.
      - name: three-rs integration tests (no GPU)
        run: |
          tests=(
            addons_lines_raycast
            addons_orbit_controls
            animation_animation_action
            animation_animation_clip
            animation_animation_mixer
            animation_animation_object_group
            animation_animation_utils
            animation_keyframe_track
            animation_property_binding
            animation_property_mixer
            cameras_perspective_camera
            core_buffer_attribute
            core_buffer_geometry
            core_layers
            core_object3d
            core_raycaster
            geometries
            gltf_loader
            math_box2
            math_box3
            math_color
            math_color_management
            math_cylindrical
            math_euler
            math_frustum
            math_interpolant
            math_interpolants
            math_line3
            math_math_utils
            math_matrix2
            math_matrix3
            math_matrix4
            math_plane
            math_quaternion
            math_ray
            math_sphere
            math_spherical
            math_spherical_harmonics3
            math_triangle
            math_vector2
            math_vector3
            math_vector4
            nodes_instanced_attributes
            nodes_line2_world_units
            nodes_morph
            nodes_mx_noise
            nodes_range_buffers
            objects_batched_mesh
            objects_group
            objects_instanced_mesh
            objects_line
            objects_line_segments
            objects_mesh
            objects_points
            objects_skinned_mesh
            objects_sprite
            pmrem
            scenes_scene
          )
          for t in "${tests[@]}"; do
            cargo test -p three-rs --test "$t"
          done

      # sdf-text's own GPU gates (sdf_text_glyph, sdf_text_block,
      # d33_treemap_labels) each build a `Renderer` too, so only these five
      # `tests/*.rs` run here.
      - name: sdf-text integration tests (no GPU)
        run: |
          tests=(atlas edt layout text vector_font)
          for t in "${tests[@]}"; do
            cargo test -p sdf-text --test "$t"
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kept in step with `rust-version` in Cargo.toml's `[workspace.package]`
      # (currently 1.90, i.e. 1.90.0); bump both together.
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
