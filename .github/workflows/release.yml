# Creates the GitHub Release for a pushed release tag, with the annotated
# tag's message as the notes. docs/RELEASING.md is the checklist this is the
# last step of; the tag is written by hand, the Release is not.
name: release

on:
  push:
    tags:
      - "v[0-9]*"          # three-rs (and any member crates shipped with it)
      - "*-v[0-9]*"        # a member crate on its own: sdf-text-v0.1.1

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout fetches the commit the tag points at; the annotated
      # tag object itself, which carries the notes, has to be fetched too.
      - name: Fetch the annotated tag
        run: git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
        env:
          TAG: ${{ github.ref_name }}

      - name: Create the Release from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "$TAG is a lightweight tag. Release tags are annotated; the message is the release notes." >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --notes-from-tag
