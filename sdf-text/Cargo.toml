[package]
name = "sdf-text"
version = "0.1.0"
description = "Signed-distance-field text from real font outlines: raster, EDT, atlas and layout, for the three-rs renderer."
documentation = "https://docs.rs/sdf-text"
readme = "README.md"
keywords = ["sdf", "text", "font", "glyph", "atlas"]
categories = ["rendering", "text-processing"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
exclude = [
    # The atlas/font goldens are large and the tests that read them run from a
    # repository checkout. `tests/assets/Roboto-Regular.ttf` is *not* excluded:
    # the examples read it, so a published crate without it has no runnable
    # example (#44). Roboto is Apache-2.0 and redistributable with the notice
    # in `LICENSE-Roboto`.
    "tests/golden/**",
    "target/**",
]

[dependencies]
# `opentype-layout` is enabled per the port plan. The GPOS `kern` walk itself is
# hand-rolled over the raw table bytes (see vector_font::kern) because
# opentype.js's first-hit semantics need the lookup *type* filter, and
# ttf-parser keeps `LookupSubtables::kind` private.
#
# tiny-skia was evaluated as the filler and dropped — see the evidence table in
# `src/raster.rs`'s module doc. It is not a dependency, so the crate has no
# rasterisation dependency at all.
#
# owned_ttf_parser is ttf-parser plus a self-referential owning wrapper, so
# `VectorFont` can own its bytes without a lifetime parameter. The plan
# (§2.2) blesses this: "no behavioural difference".
owned_ttf_parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
bytemuck = { version = "1", features = ["derive"] }
three-rs = { path = "..", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
# The `d33_treemap_labels` example: the treemap layout is the d3-hierarchy
# port's, from crates.io (https://github.com/oneilltomhq/d3-hierarchy).
d3-hierarchy = "0.1"
