[workspace]
members = [".", "sdf-text", "addons/controls", "web"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/oneilltomhq/three-rs"
authors = ["Tom O'Neill"]
rust-version = "1.90"

[package]
name = "three-rs"
version = "0.1.2"
description = "A port of three.js core and its WebGPURenderer to Rust on wgpu, graded against three.js's own end-to-end pixel comparison."
documentation = "https://docs.rs/three-rs"
readme = "README.md"
autobins = false
keywords = ["graphics", "3d", "wgpu", "webgpu", "threejs"]
categories = ["rendering::engine", "graphics", "game-development"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
exclude = [
    # Grader calibration logs and probe scripts; only of interest in the repo.
    "rung0/**",
    # Per-rung progress notes and the WGSL dumps they refer to.
    "docs/*-progress.md",
    "docs/lines/*.wgsl",
    # The gallery thumbnails. The README's grid points at raw.githubusercontent
    # URLs (so crates.io renders it), so the bytes need not ship in the crate.
    "docs/gallery/**",
    # The browser shell (issue #128). A workspace member, not part of this
    # crate: a bin crate that includes the examples as modules and is only ever
    # built for wasm32.
    "web/**",
    "target/**",
]

[dependencies]
# The backend is not in this table: the grader's Vulkan backend has no meaning
# in a browser and the WebGPU one has none on a desktop, so each is requested
# from its own target table below. Feature sets are additive across tables, so
# a native build gets `std, wgsl, vulkan` and a wasm32 build `std, wgsl,
# webgpu` (issue #128).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
serde_json = "1"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }

# Everything that only makes sense on a desktop.
#
# `vulkan` is the backend the whole grading ladder is calibrated on.
# `pollster` drives the async constructor to completion for the blocking
# `Renderer::new` / `with_instance`; a browser cannot block its one thread, so
# on wasm32 the async constructor is the only one (see `renderer::BACKENDS`).
# `winit` is the viewer binary alone, which is compiled away on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
pollster = "0.4"
winit = "0.30.8"

# `webgpu` is wgpu's `navigator.gpu` backend: it talks to the browser's own
# WebGPU implementation through web-sys rather than to a driver.
#
# `web-sys` and `js-sys` are the browser's two clocks and nothing else:
# `src/utils/time.rs` reads `window.performance.now()` and `Date.now()`, which
# is what a page's `Timer`, its `Date.now() * 0.001` and the TSL `time` node
# all run on. The feature list is the minimum that reaches
# `performance.now()`: `Window` for `web_sys::window()`, `Performance` for
# `window.performance()` and the `now()` on it. (wgpu already pulls web-sys in
# on this target; features are additive, so this adds no crate, only two
# bindings.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu"] }
web-sys = { version = "0.3", features = ["Window", "Performance"] }
js-sys = "0.3"

[dev-dependencies]
# The examples gallery generator (`examples/gallery.rs`) only. Pure Rust with
# no transitive dependencies of its own, and out of the library's dependency
# set: nothing three-rs itself builds or publishes pulls it in.
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }

# No dev-dependency on the `sdf-text` member crate, on purpose: it depends on
# three-rs, and a cycle here would either be stripped from the packaged
# manifest (path-only) or make three-rs unpublishable (versioned). The SDF
# text examples and their gates live in `sdf-text/` instead (#16).

# Explicit, and `autobins = false` above, so that `src/bin/viewer_app.rs` —
# the viewer's body, which `viewer.rs` includes only when the target is not
# wasm32 — is not picked up as a binary of its own.
[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"

[[example]]
name = "webgpu_depth_texture"
path = "examples/webgpu_depth_texture.rs"

[[example]]
name = "webgpu_instance_mesh"
path = "examples/webgpu_instance_mesh.rs"

[[example]]
name = "webgpu_instance_uniform"
path = "examples/webgpu_instance_uniform.rs"

[[example]]
name = "webgpu_tsl_interoperability"

[[example]]
name = "webgpu_materials"
path = "examples/webgpu_materials.rs"

[[example]]
name = "webgpu_materials_basic"
path = "examples/webgpu_materials_basic.rs"

[[example]]
name = "webgpu_materials_cubemap_mipmaps"
path = "examples/webgpu_materials_cubemap_mipmaps.rs"

[[example]]
name = "webgpu_materials_envmaps"
path = "examples/webgpu_materials_envmaps.rs"

[[example]]
name = "webgpu_rtt"
path = "examples/webgpu_rtt.rs"

[[example]]
name = "webgpu_postprocessing_radial_blur"
path = "examples/webgpu_postprocessing_radial_blur.rs"

[[example]]
name = "webgpu_postprocessing_difference"
path = "examples/webgpu_postprocessing_difference.rs"

[[example]]
name = "webgpu_postprocessing_direct"
path = "examples/webgpu_postprocessing_direct.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[example]]
name = "dump_wgsl"
path = "examples/dump_wgsl.rs"

# The gallery generator; `test = true` so its README-parsing and
# marker-replacement tests run under a plain `cargo test` with no GPU.
[[example]]
name = "gallery"
path = "examples/gallery.rs"
test = true

# The browser shell's per-example asset manifests (issue #128). `test = true`
# so the freshness gates that need no GPU — the table here is the README's
# graded list, and every graded example has a committed manifest — run under a
# plain `cargo test`. The contents check needs a GPU and is `--check`.
[[example]]
name = "web_manifests"
path = "examples/web_manifests.rs"
test = true
