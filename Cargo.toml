[workspace]
members = [".", "sdf-text", "addons/controls"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/oneilltomhq/three-rs"
authors = ["Tom O'Neill"]
rust-version = "1.90"

[package]
name = "three-rs"
version = "0.1.2"
description = "A port of three.js core and its WebGPURenderer to Rust on wgpu, graded against three.js's own end-to-end pixel comparison."
documentation = "https://docs.rs/three-rs"
readme = "README.md"
keywords = ["graphics", "3d", "wgpu", "webgpu", "threejs"]
categories = ["rendering::engine", "graphics", "game-development"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
exclude = [
    # Grader calibration logs and probe scripts; only of interest in the repo.
    "rung0/**",
    # Per-rung progress notes and the WGSL dumps they refer to.
    "docs/*-progress.md",
    "docs/lines/*.wgsl",
    # The gallery thumbnails. The README's grid points at raw.githubusercontent
    # URLs (so crates.io renders it), so the bytes need not ship in the crate.
    "docs/gallery/**",
    "target/**",
]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.17"
serde_json = "1"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
# The viewer binary only; the e2e path does not touch it.
winit = "0.30.8"

[dev-dependencies]
# The examples gallery generator (`examples/gallery.rs`) only. Pure Rust with
# no transitive dependencies of its own, and out of the library's dependency
# set: nothing three-rs itself builds or publishes pulls it in.
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }

# No dev-dependency on the `sdf-text` member crate, on purpose: it depends on
# three-rs, and a cycle here would either be stripped from the packaged
# manifest (path-only) or make three-rs unpublishable (versioned). The SDF
# text examples and their gates live in `sdf-text/` instead (#16).

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"

[[example]]
name = "webgpu_depth_texture"
path = "examples/webgpu_depth_texture.rs"

[[example]]
name = "webgpu_instance_mesh"
path = "examples/webgpu_instance_mesh.rs"

[[example]]
name = "webgpu_instance_uniform"
path = "examples/webgpu_instance_uniform.rs"

[[example]]
name = "webgpu_tsl_interoperability"

[[example]]
name = "webgpu_materials"
path = "examples/webgpu_materials.rs"

[[example]]
name = "webgpu_materials_basic"
path = "examples/webgpu_materials_basic.rs"

[[example]]
name = "webgpu_materials_cubemap_mipmaps"
path = "examples/webgpu_materials_cubemap_mipmaps.rs"

[[example]]
name = "webgpu_materials_envmaps"
path = "examples/webgpu_materials_envmaps.rs"

[[example]]
name = "webgpu_rtt"
path = "examples/webgpu_rtt.rs"

[[example]]
name = "webgpu_postprocessing_radial_blur"
path = "examples/webgpu_postprocessing_radial_blur.rs"

[[example]]
name = "webgpu_postprocessing_difference"
path = "examples/webgpu_postprocessing_difference.rs"

[[example]]
name = "webgpu_postprocessing_direct"
path = "examples/webgpu_postprocessing_direct.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[example]]
name = "dump_wgsl"
path = "examples/dump_wgsl.rs"

# The gallery generator; `test = true` so its README-parsing and
# marker-replacement tests run under a plain `cargo test` with no GPU.
[[example]]
name = "gallery"
path = "examples/gallery.rs"
test = true
