<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three-rs dump page - temporalReproject() in diffuse and specular mode</title>
		<meta charset="utf-8">
	</head>
	<body>
		<!--
			Not a three.js example: a minimal page for tools/dump-webgpu.mjs --html,
			so the WGSL of TemporalReprojectNode.js can be dumped and gated in
			tests/nodes_display_wgsl.rs. Its only example,
			webgpu_postprocessing_ssr_denoise, needs SSRNode and
			RecurrentDenoiseNode around it, so this page isolates it.

			The scene pass writes the MRT that page writes (output, a packed view
			normal with the roughness in alpha as UnsignedByteType, and velocity).
			Two TemporalReprojectNodes read it, each drawing a seed quad on the
			first frame and a resolve quad every frame:

			  temporalReproject( scenePassColor, ... )            -> seed 1, resolve 1
			    (defaults: diffuse, accumulate), wrapped in
			    convertToTexture()                                 -> RTT quad
			  temporalReproject( rtt, ..., { mode: 'specular',
			    accumulate: false } ).setHistoryTexture( rtt )     -> seed 2, resolve 2
			                                                        -> RenderPipeline quad

			The second is the ssr_denoise page's configuration; there its beauty
			is the SSR node and its history the denoise node, here both are the
			first node's RTT.
		-->
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, output, normalView, materialRoughness, packNormalToRGB, velocity, vec4, convertToTexture } from 'three/tsl';
			import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';

			const camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 10 );
			camera.position.set( 0, 0, 2.5 );

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x000000 );

			const material = new THREE.MeshBasicNodeMaterial( { color: 0xffffff } );
			const mesh = new THREE.Mesh( new THREE.BoxGeometry( 1, 1, 1 ), material );
			mesh.rotation.set( 0, 0, 0.3 );
			scene.add( mesh );

			const renderer = new THREE.WebGPURenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output: output,
				normal: vec4( packNormalToRGB( normalView ).rgb, materialRoughness ),
				velocity: velocity
			} ) );

			const scenePassColor = scenePass.getTextureNode( 'output' );
			const scenePassNormal = scenePass.getTextureNode( 'normal' );
			const scenePassDepth = scenePass.getTextureNode( 'depth' );
			const scenePassVelocity = scenePass.getTextureNode( 'velocity' );

			scenePass.getTexture( 'normal' ).type = THREE.UnsignedByteType;

			const diffuse = convertToTexture( temporalReproject( scenePassColor, scenePassDepth, scenePassNormal, scenePassVelocity, camera ) );

			const specular = temporalReproject( diffuse, scenePassDepth, scenePassNormal, scenePassVelocity, camera, {
				mode: 'specular',
				accumulate: false
			} );
			specular.setHistoryTexture( diffuse.value );

			const renderPipeline = new THREE.RenderPipeline( renderer );
			renderPipeline.outputNode = specular;

			renderer.setAnimationLoop( () => renderPipeline.render() );

		</script>
	</body>
</html>
