<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three-rs dump page - film(), sepia() and bleach() as four quads</title>
		<meta charset="utf-8">
	</head>
	<body>
		<!--
			Not a three.js example: a minimal page for tools/dump-webgpu.mjs --html,
			so the WGSL of FilmNode.js, Sepia.js and BleachBypass.js can be dumped
			and gated in tests/nodes_display_wgsl.rs. No webgpu_* example calls any
			of the three (webgpu_postprocessing.html and
			webgpu_tsl_interoperability.html do not either), so this page is
			their only dump.

			Each effect gets its own quad: bleach(), sepia() and film() without an
			intensity are each wrapped in convertToTexture(), which renders them
			on an RTT quad of their own, and film() with an intensity is the
			RenderPipeline's output. So the dump has one quad per effect, each
			reading the previous one's texture:

			  bleach( scenePass, uniform( 0.8 ) )  -> RTT quad 1
			  sepia( rtt1 )                        -> RTT quad 2
			  film( rtt2 )                         -> RTT quad 3
			  film( rtt3, uniform( 0.5 ) )         -> RenderPipeline quad
		-->
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, uniform, convertToTexture } from 'three/tsl';
			import { film } from 'three/addons/tsl/display/FilmNode.js';
			import { sepia } from 'three/addons/tsl/display/Sepia.js';
			import { bleach } from 'three/addons/tsl/display/BleachBypass.js';

			const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
			camera.position.set( 0, 0, 4 );

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x335577 );

			const material = new THREE.MeshBasicNodeMaterial( { color: 0xff8844 } );
			const mesh = new THREE.Mesh( new THREE.BoxGeometry( 1.5, 1.5, 1.5 ), material );
			mesh.rotation.set( 0.4, 0.6, 0 );
			scene.add( mesh );

			const renderer = new THREE.WebGPURenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			const scenePass = pass( scene, camera );

			const bleached = convertToTexture( bleach( scenePass, uniform( 0.8 ) ) );
			const sepiaed = convertToTexture( sepia( bleached ) );
			const grained = convertToTexture( film( sepiaed ) );

			const renderPipeline = new THREE.RenderPipeline( renderer );
			renderPipeline.outputNode = film( grained, uniform( 0.5 ) );

			renderer.setAnimationLoop( () => renderPipeline.render() );

		</script>
	</body>
</html>
