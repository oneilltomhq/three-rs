<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three-rs dump page - sharpen() with and without denoise as two quads</title>
		<meta charset="utf-8">
	</head>
	<body>
		<!--
			Not a three.js example: a minimal page for tools/dump-webgpu.mjs --html,
			so the WGSL of SharpenNode.js (AMD FidelityFX RCAS) can be dumped and
			gated in tests/nodes_display_wgsl.rs. The only webgpu_* example that
			calls sharpen() is webgpu_postprocessing_ssr_denoise.html, which uses
			it once, without denoise, behind SSR, a denoiser and TRAA; this page
			isolates both variants.

			sharpen() wraps its input in convertToTexture() and renders its own
			RCAS quad into a half-float target, so chaining two gives one module
			per variant, each reading the previous one's texture, plus the
			RenderPipeline's copy of the second:

			  sharpen( scenePass, 0.2 )      -> RCAS quad 1 (denoise = false)
			  sharpen( rcas1, 0.5, true )    -> RCAS quad 2 (denoise = true)
			  RenderPipeline output          -> copy quad
		-->
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass } from 'three/tsl';
			import { sharpen } from 'three/addons/tsl/display/SharpenNode.js';

			const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
			camera.position.set( 0, 0, 4 );

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x335577 );

			const material = new THREE.MeshBasicNodeMaterial( { color: 0xff8844 } );
			const mesh = new THREE.Mesh( new THREE.BoxGeometry( 1.5, 1.5, 1.5 ), material );
			mesh.rotation.set( 0.4, 0.6, 0 );
			scene.add( mesh );

			const renderer = new THREE.WebGPURenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			const scenePass = pass( scene, camera );

			const a = sharpen( scenePass, 0.2 );

			const renderPipeline = new THREE.RenderPipeline( renderer );
			renderPipeline.outputNode = sharpen( a, 0.5, true );

			renderer.setAnimationLoop( () => renderPipeline.render() );

		</script>
	</body>
</html>
